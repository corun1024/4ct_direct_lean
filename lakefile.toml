name = "FourColor"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FourColor"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Lean is the elaborator only.  Its kernel is switched off for every module and
# every declaration is checked by lazylean on the exported closure instead
# (scripts/verify.sh); see the README.
debug.skipKernelTC = true

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "FourColor"
